<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhoneBox">
<meta name="theme-color" content="#01060d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PhoneBox</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="dashboard" class="dashboard stale">
  <header class="top">
    <b id="clock" class="clock" aria-hidden="true"></b>
    <span class="top-side">
      <span id="top-line" class="top-line"></span>
      <span id="status" class="status" role="status" aria-live="polite">
        <span id="phone-battery" class="phone-battery" hidden>
          <span class="battery-body"><span class="battery-fill"></span><span class="battery-bolt">⚡</span></span><span class="battery-cap"></span>
          <span id="phone-percent"></span>
        </span>
        <span class="dot"></span><span id="status-text"></span>
      </span>
    </span>
  </header>

  <section class="rings">
    <button class="ring-button" data-metric="cpu" type="button">
      <span class="ring"><canvas aria-hidden="true"></canvas><span class="ring-inner"><span class="ring-value" id="cpu-ring">—</span><span class="ring-label">CPU</span></span></span>
      <span class="ring-sub" id="cpu-sub"></span>
    </button>
    <button class="ring-button" data-metric="ram" type="button">
      <span class="ring"><canvas aria-hidden="true"></canvas><span class="ring-inner"><span class="ring-value" id="ram-ring">—</span><span class="ring-label">RAM</span></span></span>
      <span class="ring-sub" id="ram-sub"></span>
    </button>
  </section>

  <section class="graph card">
    <div class="graph-head"><span class="graph-title" id="graph-title"></span><span class="graph-value" id="graph-value">—</span></div>
    <div class="graph-detail" id="graph-detail"></div>
    <canvas id="graph" aria-hidden="true"></canvas>
  </section>

  <section class="tiles">
    <button class="tile card" data-metric="gpu" type="button"><span class="tile-label"><i></i><span data-metric-label="gpu"></span></span><span class="tile-value" id="gpu-tile">—</span></button>
    <button class="tile card" data-metric="temp" type="button"><span class="tile-label"><i></i><span data-metric-label="temp"></span></span><span class="tile-value" id="temp-tile">—</span></button>
    <button class="tile card" data-metric="power" type="button"><span class="tile-label"><i></i><span data-metric-label="power"></span></span><span class="tile-value" id="power-tile">—</span></button>
    <button class="tile card" data-metric="net" type="button"><span class="tile-label"><i></i><span data-metric-label="net"></span></span><span class="tile-value" id="net-tile">—</span></button>
    <button class="tile card" data-metric="disk" type="button"><span class="tile-label"><i></i><span data-text="diskTile"></span></span><span class="tile-value" id="disk-tile">—</span></button>
    <button class="tile card" data-metric="battery" type="button"><span class="tile-label"><i></i><span data-metric-label="battery"></span></span><span class="tile-value" id="battery-tile">—</span></button>
  </section>

  <section class="now-playing card" id="now-playing" hidden>
    <span class="np-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="np-text"><span class="np-title" id="np-title"></span><span class="np-sub" id="np-sub"></span></span>
  </section>

  <section class="apps">
    <div class="apps-head"><span data-text="apps"></span><button id="app-sort" class="app-sort" type="button"></button></div>
    <ol id="app-list" class="app-list"></ol>
  </section>

  <section id="strip" class="strip card">
    <button id="media-previous" class="strip-button" type="button" data-media="previous" data-label="previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button id="media-play" class="strip-button" type="button" data-media="playPause" data-label="playPause">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="media-next" class="strip-button" type="button" data-media="next" data-label="next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <div id="volume" class="volume" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-label="volume">
      <span class="volume-track"><span class="volume-fill"></span><span class="volume-thumb"></span></span>
    </div>
    <button id="mute" class="strip-button" type="button" data-label="mute">
      <svg class="icon-speaker" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="more" class="strip-button" type="button" aria-haspopup="menu">⋯</button>
  </section>
</main>

<div id="edge" class="edge" aria-hidden="true"></div>

<div id="state" class="state" hidden><div class="state-card"><h2 id="state-title"></h2><p id="state-text"></p></div></div>

<div id="menu-backdrop" class="menu-backdrop" hidden></div>
<div id="menu" class="menu" role="menu" hidden>
  <div id="menu-host" class="menu-host"></div>
  <button type="button" role="menuitem" data-command="lock" data-text="lock"></button>
  <button type="button" role="menuitem" data-command="displaySleep" data-text="displaySleep"></button>
  <button type="button" role="menuitem" data-command="sleep" data-text="sleep"></button>
  <div class="menu-gap"></div>
  <button id="menu-guide" type="button" role="menuitem" data-text="guideItem"></button>
</div>

<div id="confirm" class="confirm">
  <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="confirm-buttons">
      <button id="confirm-cancel" type="button" data-text="cancel"></button>
      <button id="confirm-ok" class="danger" type="button"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-icon" aria-hidden="true"></span><span id="toast-text"></span></div>

<div id="guide" class="overlay guide" hidden>
  <div class="guide-card">
    <h2 data-text="guideTitle"></h2>
    <ol class="guide-steps">
      <li><strong data-text="guide1Title"></strong><p id="guide1-text"></p></li>
      <li>
        <strong data-text="guide2Title"></strong><p data-text="guide2Text"></p>
        <span id="guide-link-row" class="link-row"><input id="guide-link" readonly><button id="guide-copy" type="button" data-text="copy"></button></span>
      </li>
      <li><strong data-text="guide3Title"></strong><p data-text="guide3Text"></p></li>
    </ol>
    <p id="guide-audio" class="note" data-text="guideAudioNote" hidden></p>
    <button id="guide-done" class="primary" type="button"></button>
  </div>
</div>

<div id="start" class="overlay start" hidden>
  <button id="start-button" class="primary" type="button" data-text="start"></button>
  <p data-text="startNote"></p>
</div>

<video id="keepawake" playsinline preload="auto" src="keepawake.mp4"></video>
<script src="sha256.js"></script>
<script src="i18n.js"></script>
<script src="format.js"></script>
<script src="history.js"></script>
<script src="metrics.js"></script>
<script src="heat.js"></script>
<script src="motion.js"></script>
<script src="rings.js"></script>
<script src="clock.js"></script>
<script src="chart.js"></script>
<script src="connection.js"></script>
<script src="commands.js"></script>
<script src="view.js"></script>
<script src="ui.js"></script>
<script src="controls.js"></script>
<script src="app.js"></script>
</body>
</html>
